{% extends 'base.html' %}{% block content %}
<section class="auth-bg"><div class="container-xxl py-5"><div class="auth-card mx-auto">
 <div class="auth-icon">✦</div><span class="eyebrow">WELCOME BACK</span><h1>Sign in to CampusFind</h1><p class="text-muted">Your lost-and-found journey starts here.</p>
 <form method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" required maxlength="200" autocomplete="username" value="{{ request.form.get('email', '') }}"></div>
  <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
  <button class="btn btn-brand w-100 btn-lg" type="submit">Sign in →</button>
 </form><p class="text-center small text-muted mt-4 mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
 </div></div></section>
{% endblock %}
