{% extends 'base.html' %}{% block content %}
<div class="container-xxl py-5"><div class="auth-card mx-auto"><div class="auth-icon">🔐</div><span class="eyebrow">SECURITY</span><h1>Change password</h1>
{% if current_user.must_change_password %}<div class="alert alert-warning">For security, change your default administrator password before opening the console.</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label for="current_password" class="form-label">Current password</label><input id="current_password" name="current_password" type="password" required class="form-control"></div><div class="mb-3"><label for="new_password" class="form-label">New password</label><input id="new_password" name="new_password" type="password" required minlength="12" class="form-control"><small class="text-muted">12+ characters, including a letter and number.</small></div><div class="mb-4"><label for="confirm_password" class="form-label">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" required class="form-control"></div><button class="btn btn-brand w-100" type="submit">Update password</button></form></div></div>
{% endblock %}
